name: ci

# Three questions, answered on every push and once a day:
#   host        does the crate build, lint, and pass its tests on each desktop, with that host's
#               own arm compiled in (the C arm on Linux, the C++ SAPI arm on Windows)?
#   cross-check do the Rust halves compile for the targets whose arms cargo cannot run here?
#   demo        does the walkthrough pass on macOS, the iOS Simulator, the Android emulator,
#               headless WebKit, and the HarmonyOS emulator, against day's newest main?
#
# No Cargo.lock is committed, here or in demo/: this crate tracks an unpublished framework by
# its bare git URL, so every run resolves day afresh at the tip of main and proves the crate
# against it. A red run after a day push is the signal, not a nuisance, and there is no pinned
# lock for a local `day patch` table to rewrite and commit by accident.
on:
  push:
    branches: ["**"]
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  pull_request:
  workflow_dispatch:
  schedule:
    # Daily: day's main moves on weeks nobody pushes here.
    - cron: "0 5 * * *"

permissions:
  contents: write # release-asset upload on tag builds

jobs:
  # One row per desktop, because each compiles a different arm. `build.rs` writes every C and C++
  # translation unit and compiles the one the target selects: Linux builds the dlopen'ed
  # speech-dispatcher arm and runs the tests against it (no engine installed, so `available()`
  # must say Unsupported); Windows builds the SAPI arm against the SDK's sapi.h; macOS takes the
  # Rust fallback, since the Swift arm is compiled by xcodebuild inside an app build, which is
  # the demo job's business.
  host:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all -- --check
        if: matrix.os == 'ubuntu-latest'
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # The Rust halves compile for the targets whose arms only a device build can link: the Swift
  # arm's iOS side, the JNI side of the Java arm (which pulls day-android), and the wasm side of
  # the JavaScript arm. A drift in a generated signature fails here in a minute rather than in
  # the emulator.
  cross-check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, target: aarch64-apple-ios-sim }
          - { os: ubuntu-latest, target: aarch64-linux-android }
          - { os: ubuntu-latest, target: wasm32-unknown-unknown }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo clippy --target ${{ matrix.target }} -- -D warnings

  # The proof: the demo app, driven end to end by the shared Day workflow. It builds against day's
  # newest main, runs dayscript/speech.yaml, and fails on a failed assertion or a blank capture.
  # Screenshots are uploaded per target, and a tag build attaches them to the release. Five
  # targets, five arms: Swift on macOS and iOS, Java on Android, JavaScript in WebKit, ArkTS on
  # HarmonyOS. With the two desktop host rows above, every arm meets a compiler (or, for
  # JavaScript, a browser) somewhere in this workflow.
  demo:
    uses: daybrite/actions/.github/workflows/dayapp.yml@main
    secrets: inherit
    with:
      project-path: demo
      targets: macos-appkit, ios-uikit, android-mdc, web-dom, harmony-arkui
      # The CLI that builds, and the framework revision: with no lock committed the shared
      # workflow resolves one fresh, and this moves every leg to the same tip-of-main revision.
      day-version: main
      update-day-deps: true
      scripts: dayscript/speech.yaml
      preflight-checks: fmt, clippy, test
      ios-devices: |
        device=iPhone, orientation=portrait
      android-devices: |
        device=pixel_7,     os=36, orientation=portrait

