name: ci

# Three questions, answered on every push and once a day:
#   host        does the crate build, lint, and pass its tests on each desktop, with that host's
#               own arm compiled in (the C arm on Linux, the C++ SAPI arm on Windows)?
#   cross-check do the Rust halves compile for the targets whose arms cargo cannot run here?
#   demo        does the walkthrough pass on macOS, Windows WinUI, the iOS Simulator, Android,
#               headless WebKit, and the HarmonyOS emulator, against day's main or newest release?
#
# No Cargo.lock is committed, here or in demo/: every run resolves day afresh. A push builds against the
# head of day's main (and of every other Day repository it uses), and the nightly run against
# the newest releases on crates.io (daybrite/actions' day-deps). A red push run after a day push
# is the signal, not a nuisance; a red nightly run means this crate needs a day that is not
# released yet. There is no pinned lock for a local `day patch` table to rewrite and commit by
# accident.
on:
  push:
    branches: ["**"]
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  pull_request:
  workflow_dispatch:
    inputs:
      day-main:
        description: Build against day's main branch instead of the newest release
        type: boolean
        default: false
  schedule:
    # Daily: day's main moves on weeks nobody pushes here.
    - cron: "0 6 * * *"

# The repository's own jobs run this checkout's code with a read-only token. The write grants
# sit on the job that calls the shared workflow, whose release and Pages jobs alone use them;
# its build legs, which run this code too, narrow their token to read-only themselves.
permissions:
  contents: read

jobs:
  # One row per desktop, because each compiles a different arm. `build.rs` writes every C and C++
  # translation unit and compiles the one the target selects: Linux builds the dlopen'ed
  # speech-dispatcher arm and runs the tests against it (no engine installed, so `available()`
  # must say Unsupported); Windows builds the SAPI arm against the SDK's sapi.h; macOS takes the
  # Rust fallback, since the Swift arm is compiled by xcodebuild inside an app build, which is
  # the demo job's business.
  host:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # Day from crates.io, or from main on a push (daybrite/actions day-deps).
      - uses: daybrite/actions/.github/actions/day-deps@v1
        with:
          day-deps: ${{ inputs.day-main && 'main' || 'auto' }}
      - run: cargo fmt --all -- --check
        if: matrix.os == 'ubuntu-latest'
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # The Rust halves compile for the targets whose arms only a device build can link: the Swift
  # arm's iOS side, the JNI side of the Java arm (which pulls day-toolkit-material), and the wasm side of
  # the JavaScript arm. A drift in a generated signature fails here in a minute rather than in
  # the emulator.
  cross-check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, target: aarch64-apple-ios-sim }
          - { os: ubuntu-latest, target: aarch64-linux-android }
          - { os: ubuntu-latest, target: wasm32-unknown-unknown }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # Day from crates.io, or from main on a push (daybrite/actions day-deps).
      - uses: daybrite/actions/.github/actions/day-deps@v1
        with:
          day-deps: ${{ inputs.day-main && 'main' || 'auto' }}
      - run: cargo clippy --target ${{ matrix.target }} -- -D warnings

  # The proof: the demo app, driven end to end by the shared Day workflow. It builds against day's
  # newest main, runs dayscript/speech.yaml, and fails on a failed assertion or a blank capture.
  # Screenshots are uploaded per target, and a tag build attaches them to the release. Six
  # targets, five arms: Swift on macOS and iOS, Java on Android, JavaScript in WebKit, ArkTS on
  # HarmonyOS, and SAPI on Windows. With the desktop host rows above, every arm meets a compiler
  # (or, for JavaScript, a browser) somewhere in this workflow.
  demo:
    uses: daybrite/actions/.github/workflows/dayapp.yml@v1
    permissions:
      contents: write # release-asset upload on tag builds
      id-token: write # crates.io Trusted Publishing (publish-crates)
    secrets: inherit
    with:
      project-path: demo
      targets: windows-winui, macos-appkit, ios-uikit, android-material, web-dom, harmony-arkui
      day-deps: ${{ inputs.day-main && 'main' || 'auto' }}
      # On a version tag, after every leg passed: the library crates to crates.io.
      publish-crates: true
      scripts: dayscript/speech.yaml
      preflight-checks: fmt, clippy, test
      ios-devices: |
        device=iPhone, orientation=portrait
      android-devices: |
        device=pixel_7,     os=36, orientation=portrait

