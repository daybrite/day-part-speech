[package]
name = "day-part-speech"
version = "0.5.0"
edition = "2024"
rust-version = "1.89"
description = "Text to speech for Day apps through each platform's own engine"
repository = "https://github.com/daybrite/day-part-speech"
license = "MPL-2.0"

# An external Day Part (https://daybrite.dev/docs/reference/parts): a headless capability crate with no UI
# Piece, and daybridge's reference sample (https://daybrite.dev/contributing/backend-contracts/bridge). Every
# platform has text to speech and exposes it in a different language, so `src/lib.rs` carries one
# Swift, Java, ArkTS, JavaScript, C++ (Windows SAPI), and C arm beside the Rust fallback, all
# under one declaration. `build.rs` generates the glue; nothing here is written twice.
#
# Daybrite-owned dependencies accept every stable 0.x release. Apps retain a tested
# dependency set with Cargo.lock; updating it may require source changes.

[package.metadata.day]
# Accept the pre-1.0 series; source compatibility between releases is not guaranteed.
compat = "0.*"

# Lint policy: Clippy's `pedantic` group is on, and CI treats every warning as an error
# (`-D warnings`). The table matches the one in `day`.
[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Day converts between float layout units and the integer pixel, index and FFI types of eight
# native toolkits. `as` is the only operator for float-to-integer, and these four lints cannot
# tell that from a narrowing integer cast, so they would need an exception at nearly every site.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
# Function length and short or similar names are style limits this codebase does not follow:
# geometry is written in `x`/`y`/`w`/`h`, and a backend's realize and patch arms stay in one place.
many_single_char_names = "allow"
similar_names = "allow"
too_many_lines = "allow"
# A backend module imports the whole spec vocabulary, and which names it uses differs with the
# backend feature and target, so an explicit list is unused or incomplete under some of them.
wildcard_imports = "allow"
# Option structs and backend calls mirror native toolkit flags, which are booleans.
fn_params_excessive_bools = "allow"
struct_excessive_bools = "allow"
# Asks for `#[must_use]` on nearly every function that returns a value, including ones called
# for their effect. Builders are still covered by `return_self_not_must_use`.
must_use_candidate = "allow"

[dependencies]
day-bridge = "0.*"

# The Java arm is called through JNI, so the generated code needs day-platform-android's cached JVM and
# Context, the same dependency day-part-device's Android arm has.
[target.'cfg(target_os = "android")'.dependencies]
day-platform-android = "0.*"

[build-dependencies]
day-build = "0.*"
