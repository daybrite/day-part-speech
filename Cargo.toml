[package]
name = "day-part-speech"
version = "0.4.3"
edition = "2024"
rust-version = "1.89"
description = "Text to speech for Day apps through each platform's own engine"
repository = "https://github.com/daybrite/day-part-speech"
license = "MPL-2.0"

# An external Day Part (https://daybrite.dev/docs/reference/parts): a headless capability crate with no UI
# Piece, and daybridge's reference sample (https://daybrite.dev/contributing/backend-contracts/bridge). Every
# platform has text to speech and exposes it in a different language, so `src/lib.rs` carries one
# Swift, Java, ArkTS, JavaScript, C++ (Windows SAPI), and C arm beside the Rust fallback, all
# under one declaration. `build.rs` generates the glue; nothing here is written twice.
#
# Daybrite-owned dependencies accept every stable 0.x release. Apps retain a tested
# dependency set with Cargo.lock; updating it may require source changes.

[package.metadata.day]
# Accept the pre-1.0 series; source compatibility between releases is not guaranteed.
compat = "0.*"

[dependencies]
day-bridge = "0.*"

# The Java arm is called through JNI, so the generated code needs day-platform-android's cached JVM and
# Context, the same dependency day-part-device's Android arm has.
[target.'cfg(target_os = "android")'.dependencies]
day-platform-android = "0.*"

[build-dependencies]
day-build = "0.*"
