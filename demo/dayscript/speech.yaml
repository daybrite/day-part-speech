# The demo's walkthrough (https://daybrite.dev/docs/dayscript), and the crate's on-device test:
# it runs on macOS, the iOS Simulator, and the Android emulator in CI, and the same command runs
# it here.
#
#     day launch -p macos-appkit --script dayscript/speech.yaml
#     day launch -p ios-uikit --script dayscript/speech.yaml
#     day launch -p android-mdc --script dayscript/speech.yaml
#
# What a script can check: the page renders, the support label carries the part's answer for
# this target, and both bridged calls run without wedging the UI. A v1 bridge call is one-shot,
# so the app is never told when the engine finished talking and nothing on screen reports it.
# Hearing the voice is the acceptance test, and it needs a person.
name: speech
description: Report the part's support for this host, speak a typed line through the platform's engine, and stop it.
flow:
  - wait_for: { id: speech-support }
  - assert_visible: { id: speech-title }
  # The three arms CI links are all Native: AVSpeechSynthesizer on macOS and iOS, TextToSpeech on
  # Android. A Linux desktop without speech-dispatcher would read Unsupported here, and a host that
  # said Native and then stayed silent is the bug `available()` exists to prevent.
  - assert_text: { id: speech-support, text: "Native", only_on: [appkit, uikit, mdc] }
  - screenshot: speech

  # Empty means "speak the sample the placeholder shows"; typing overrides it.
  - input: { id: speech-text, text: "Day speaks through the bridge." }
  - tap: { id: speech-speak }
  - pause: { secs: 1.0 }
  - tap: { id: speech-stop }
  - assert_text: { id: speech-text, text: "Day speaks through the bridge." }
  - screenshot: speech-stopped
