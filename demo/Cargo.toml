[package]
name = "speech-demo"
version = "0.1.0"
edition = "2024"
# Generates typed `res::` constants from `resource/` (see build.rs).
build = "build.rs"
publish = false

[features]
# `mock` keeps bare cargo and rust-analyzer compiling; `day build` overrides it with
# `--no-default-features --features <backend>` (https://daybrite.dev/docs/project-structure).
default = ["mock"]
appkit = ["day/appkit"]
gtk = ["day/gtk"]
uikit = ["day/uikit"]
mdc = ["day/mdc"]
dom = ["day/dom"]
arkui = ["day/arkui"]
mock = ["day/mock"]

# rlib for the desktop bin; the mobile pipeline requests staticlib/cdylib via `cargo rustc`.
[lib]
# A constant lib name: staged artifacts and the `dayapp::` import never move on a package rename.
name = "dayapp"
crate-type = ["rlib"]

[dependencies]
# The bare canonical URL, no ref: Cargo.lock (committed) pins the revision this demo was tested
# against, and `cargo update` moves it. See ../Cargo.toml for why a ref would double the graph.
day = { git = "https://github.com/daybrite/day.git" }
# The part under test, by path: a change to the part and to the demo land in one pull request
# and one CI run. An app depends on it from git instead:
#     day-part-speech = { git = "https://github.com/daybrite/day-part-speech.git" }
day-part-speech = { path = ".." }

[build-dependencies]
day-build = { git = "https://github.com/daybrite/day.git" }

[workspace]
